<!-- DESIGN REFERENCE ONLY — not used in the web app -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarvagna Chat</title>
    <style>
        :root {
            --bg-color: var(--vscode-editor-background, #1e1e1e);
            --fg-color: var(--vscode-editor-foreground, #cccccc);
            --border-color: var(--vscode-panel-border, #444444);
            --input-bg: var(--vscode-input-background, #3c3c3c);
            --input-fg: var(--vscode-input-foreground, #cccccc);
            --btn-bg: var(--vscode-button-background, #0e639c);
            --btn-fg: var(--vscode-button-foreground, #ffffff);
            --btn-hover: var(--vscode-button-hoverBackground, #1177bb);
            --chat-user-bg: var(--vscode-textBlockQuote-background, #2d2d2d);
            --chat-ai-bg: var(--vscode-editorWidget-background, #252526);
            --font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--fg-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border-color); background-color: var(--vscode-sideBar-background, #252526); }
        .header-title { font-weight: 600; font-size: 16px; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        select { background-color: var(--input-bg); color: var(--input-fg); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; outline: none; }
        .icon-btn { background: none; border: none; color: var(--fg-color); cursor: pointer; padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background-color: var(--vscode-toolbar-hoverBackground, rgba(90, 93, 94, 0.31)); }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .message { display: flex; max-width: 85%; gap: 12px; line-height: 1.5; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--btn-bg); color: var(--btn-fg); display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .message.user .avatar { background-color: #5a5a5a; }
        .bubble { padding: 10px 14px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .message.user .bubble { background-color: var(--chat-user-bg); border-bottom-right-radius: 2px; }
        .message.ai .bubble { background-color: var(--chat-ai-bg); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
        .typing-indicator { display: none; align-items: center; gap: 4px; padding: 12px 16px; background-color: var(--chat-ai-bg); border: 1px solid var(--border-color); border-radius: 8px; align-self: flex-start; border-bottom-left-radius: 2px; margin-bottom: 16px; }
        .dot { width: 6px; height: 6px; background-color: var(--fg-color); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .quick-commands { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; border-top: 1px solid var(--border-color); background-color: var(--vscode-editorWidget-background, #252526); scrollbar-width: none; }
        .quick-commands::-webkit-scrollbar { display: none; }
        .cmd-btn { background-color: var(--vscode-badge-background, #4d4d4d); color: var(--vscode-badge-foreground, #ffffff); border: none; padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
        .cmd-btn:hover { opacity: 0.8; }
        .input-area { display: flex; align-items: flex-end; gap: 8px; padding: 16px; background-color: var(--bg-color); border-top: 1px solid var(--border-color); }
        .input-wrapper { flex: 1; display: flex; align-items: center; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; }
        textarea { flex: 1; background: transparent; border: none; color: var(--input-fg); resize: none; outline: none; font-family: var(--font-family); font-size: 14px; max-height: 120px; min-height: 20px; overflow-y: auto; }
        .send-btn { background-color: var(--btn-bg); color: var(--btn-fg); border: none; border-radius: 4px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background-color 0.2s; }
        .send-btn:hover { background-color: var(--btn-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Sarvagna</div>
        <div class="header-controls">
            <select aria-label="Subject Selector">
                <option value="cs">Computer Science</option>
                <option value="math">Mathematics</option>
            </select>
            <button class="icon-btn" title="Voice Input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            </button>
        </div>
    </header>
    <div class="chat-container" id="chat-container">
        <div class="message ai">
            <div class="avatar">S</div>
            <div class="bubble">Hello! I am Sarvagna. How can I assist with your learning today?</div>
        </div>
        <div class="typing-indicator" id="typing-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>
    <div class="quick-commands">
        <button class="cmd-btn">Teach me</button>
        <button class="cmd-btn">Generate Roadmap</button>
        <button class="cmd-btn">Make Flashcards</button>
        <button class="cmd-btn">Analyze QP</button>
        <button class="cmd-btn">Exam Mode</button>
    </div>
    <div class="input-area">
        <button class="icon-btn" title="Attach File">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <div class="input-wrapper">
            <textarea id="chat-input" rows="1" placeholder="Ask Sarvagna..."></textarea>
        </div>
        <button class="send-btn" id="send-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
    <script>
        (function() {
            const chatContainer = document.getElementById('chat-container');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing-indicator');
            const cmdBtns = document.querySelectorAll('.cmd-btn');
            const scrollToBottom = () => { chatContainer.scrollTop = chatContainer.scrollHeight; };
            const autoResize = () => { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px'; };
            const appendMessage = (text, sender, streaming = false) => {
                const msg = document.createElement('div'); msg.className = `message ${sender}`;
                const av = document.createElement('div'); av.className = 'avatar'; av.textContent = sender === 'user' ? 'U' : 'S';
                const bub = document.createElement('div'); bub.className = 'bubble';
                msg.appendChild(av); msg.appendChild(bub);
                chatContainer.insertBefore(msg, typingIndicator);
                if (!streaming) { bub.textContent = text; scrollToBottom(); }
                return bub;
            };
            const handleSend = () => {
                const text = chatInput.value.trim(); if (!text) return;
                appendMessage(text, 'user'); chatInput.value = ''; autoResize();
                typingIndicator.style.display = 'flex'; scrollToBottom(); sendBtn.disabled = true;
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const bub = appendMessage('', 'ai', true);
                    const full = "Simulated streaming response from Sarvagna AI.";
                    let i = 0;
                    const iv = setInterval(() => { bub.textContent += full.slice(i, i+3); i+=3; scrollToBottom(); if (i >= full.length) { clearInterval(iv); sendBtn.disabled = false; } }, 20);
                }, 800);
            };
            chatInput.addEventListener('input', autoResize);
            chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
            sendBtn.addEventListener('click', handleSend);
            cmdBtns.forEach(b => b.addEventListener('click', () => { chatInput.value = b.textContent; autoResize(); chatInput.focus(); }));
        })();
    </script>
</body>
</html>
