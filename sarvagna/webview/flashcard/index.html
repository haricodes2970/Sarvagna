<!-- DESIGN REFERENCE ONLY — not used in the web app -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarvagna Flashcards</title>
    <style>
        :root { --bg-color: var(--vscode-editor-background, #1e1e1e); --fg-color: var(--vscode-editor-foreground, #cccccc); --border-color: var(--vscode-panel-border, #444444); --btn-bg: var(--vscode-button-background, #0e639c); --btn-fg: var(--vscode-button-foreground, #ffffff); --btn-hover: var(--vscode-button-hoverBackground, #1177bb); --card-bg: var(--vscode-editorWidget-background, #252526); --font-family: var(--vscode-font-family, sans-serif); --color-easy: #10B981; --color-medium: #F59E0B; --color-hard: #EF4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--fg-color); display: flex; flex-direction: column; height: 100vh; padding: 20px; overflow: hidden; }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: var(--vscode-descriptionForeground, #999); }
        .stats-row strong { color: var(--fg-color); }
        .progress-container { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { height: 100%; background-color: var(--btn-bg); width: 0%; transition: width 0.3s ease; }
        .flashcard-scene { flex: 1; perspective: 1000px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .flashcard { width: 100%; max-width: 500px; height: 300px; position: relative; transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1); transform-style: preserve-3d; cursor: pointer; }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; background-color: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .card-front { font-size: 20px; font-weight: 500; }
        .card-back { transform: rotateY(180deg); justify-content: space-between; }
        .answer-text { flex: 1; display: flex; align-items: center; font-size: 16px; line-height: 1.5; }
        .difficulty-btns { display: flex; gap: 12px; width: 100%; margin-top: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .flashcard.is-flipped .difficulty-btns { opacity: 1; pointer-events: auto; }
        .diff-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: 600; color: #fff; cursor: pointer; }
        .diff-btn.easy { background-color: var(--color-easy); }
        .diff-btn.medium { background-color: var(--color-medium); }
        .diff-btn.hard { background-color: var(--color-hard); }
        .controls { display: flex; justify-content: center; align-items: center; gap: 16px; }
        .icon-btn { background-color: var(--card-bg); color: var(--fg-color); border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-btn:hover:not(:disabled) { background-color: var(--border-color); }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .keyboard-hints { text-align: center; margin-top: 16px; font-size: 12px; color: var(--vscode-descriptionForeground, #777); }
        kbd { background-color: var(--border-color); padding: 2px 6px; border-radius: 3px; font-family: monospace; }
        #progress-text { text-align: center; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="stats-row">
        <span>Due: <strong>12</strong></span>
        <span>Learning: <strong>5</strong></span>
        <span>Mastered: <strong>24</strong></span>
    </div>
    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
    <div id="progress-text">Card 1 of 5</div>

    <div class="flashcard-scene">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front" id="card-front">What is the time complexity of searching in a balanced BST?</div>
            <div class="card-face card-back">
                <div class="answer-text" id="card-back">O(log n) — tree height is kept logarithmic.</div>
                <div class="difficulty-btns">
                    <button class="diff-btn hard">Hard</button>
                    <button class="diff-btn medium">Medium</button>
                    <button class="diff-btn easy">Easy</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="icon-btn" id="btn-prev" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="icon-btn" id="btn-shuffle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="icon-btn" id="btn-next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>
    <div class="keyboard-hints"><kbd>Space</kbd> Flip &nbsp;•&nbsp; <kbd>1</kbd> Easy &nbsp;•&nbsp; <kbd>2</kbd> Medium &nbsp;•&nbsp; <kbd>3</kbd> Hard</div>

    <script>
        (function() {
            const cards = [
                { q: "What is the time complexity of searching in a balanced BST?", a: "O(log n) — tree height is kept logarithmic." },
                { q: "Explain closure in JavaScript.", a: "A function bundled with references to its surrounding lexical environment." },
                { q: "What is the Virtual DOM?", a: "A lightweight JS representation of the actual DOM used to batch and optimize rendering." },
                { q: "Difference between TCP and UDP?", a: "TCP: connection-oriented, guaranteed delivery. UDP: connectionless, faster, no guarantee." },
                { q: "What does ACID stand for?", a: "Atomicity, Consistency, Isolation, Durability." }
            ];
            let idx = 0;
            const flashcard = document.getElementById('flashcard');
            const front = document.getElementById('card-front');
            const back = document.getElementById('card-back');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            const render = () => {
                flashcard.classList.remove('is-flipped');
                setTimeout(() => {
                    front.textContent = cards[idx].q;
                    back.childNodes[0].textContent = cards[idx].a;
                    progressText.textContent = `Card ${idx+1} of ${cards.length}`;
                    progressBar.style.width = `${((idx+1)/cards.length)*100}%`;
                    btnPrev.disabled = idx === 0;
                    btnNext.disabled = idx === cards.length - 1;
                }, 150);
            };
            flashcard.addEventListener('click', () => flashcard.classList.toggle('is-flipped'));
            btnNext.addEventListener('click', () => { if (idx < cards.length-1) { idx++; render(); } });
            btnPrev.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
            document.getElementById('btn-shuffle').addEventListener('click', () => { cards.sort(() => Math.random()-0.5); idx = 0; render(); });
            document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (idx < cards.length-1) { idx++; render(); } }));
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') { e.preventDefault(); flashcard.classList.toggle('is-flipped'); }
                else if (flashcard.classList.contains('is-flipped')) {
                    if (['1','2','3'].includes(e.key)) { e.preventDefault(); if (idx < cards.length-1) { idx++; render(); } }
                } else {
                    if (e.code === 'ArrowRight') { e.preventDefault(); if (idx < cards.length-1) { idx++; render(); } }
                    if (e.code === 'ArrowLeft') { e.preventDefault(); if (idx > 0) { idx--; render(); } }
                }
            });
            render();
        })();
    </script>
</body>
</html>
