services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sarvagna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sarvagna-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sarvagna-network

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sarvagna-network

volumes:
  postgres_data:
  qdrant_data:

networks:
  sarvagna-network:
    driver: bridge
